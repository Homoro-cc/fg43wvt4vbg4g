<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Data</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        /* General page layout */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f8fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px; /* Add padding to prevent the content from being too close to the top */
        }

        /* Container for the content */
        div {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 90%;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden; /* Ensure no content overflows */
        }

        /* Title styling */
        h1 {
            text-align: center;
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* Table container with horizontal scrolling */
        .table-container {
            width: 100%;
            overflow-x: auto; /* Enable horizontal scrolling */
            margin-top: 20px;
        }

        /* Table styling */
        table {
            width: 100%;
            min-width: 6px; /* Prevent table from shrinking too much */
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
            font-size: 1.1em;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        td {
            color: #555;
            font-size: 1em;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            table {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>Imported Denominators Data</h1>
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <!-- Table headers will be inserted dynamically -->
                    </tr>
                </thead>
                <tbody>
                    <!-- Table rows will be inserted dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1vhGvHYWyxQth8tsqmAVCCSKIJcX2rWm4c2Ol9jb-NVw'; // Your Google Sheet ID
        const RANGE = 'Imported Denominators!A1:S'; // Your sheet range

        // Fetch API key from config.json
        async function getAPIKey() {
            const response = await fetch('config.json');
            const config = await response.json();
            return config.API_KEY;
        }

        async function start() {
            const API_KEY = await getAPIKey();

            gapi.client.init({
                'apiKey': API_KEY,
                'discoveryDocs': ["https://sheets.googleapis.com/$discovery/rest?version=v4"]
            }).then(function () {
                // Load the spreadsheet data
                loadSheetData();
            });
        }

        function loadSheetData() {
            gapi.client.sheets.spreadsheets.values.get({
                spreadsheetId: SPREADSHEET_ID,
                range: RANGE,
            }).then(function (response) {
                const data = response.result.values;

                // Debugging: Log the raw data to check if it's being fetched
                console.log('Fetched Data:', data);

                if (data.length > 0) {
                    // Get table headers from the first row
                    const headers = data[0];
                    const tableHead = document.querySelector('#data-table thead tr');
                    headers.forEach(header => {
                        const th = document.createElement('th');
                        th.textContent = header;
                        tableHead.appendChild(th);
                    });

                    // Get table rows from the remaining data
                    const tableBody = document.querySelector('#data-table tbody');
                    data.slice(1).forEach(row => {
                        const tr = document.createElement('tr');
                        row.forEach(cell => {
                            const td = document.createElement('td');
                            td.textContent = cell;
                            tr.appendChild(td);
                        });
                        tableBody.appendChild(tr);
                    });
                } else {
                    // Handle the case when no data is available
                    console.log('No data available in the sheet.');
                }
            }, function (error) {
                console.error('Error fetching data: ' + error.message);
            });
        }

        // Load the Google API client
        gapi.load('client', start);
    </script>
</body>
</html>
